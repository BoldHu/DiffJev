# Execution profiles. Always check actual GPU memory before choosing these.
local_rtx3050:
  purpose: unit tests and synthetic smoke runs with the mock backbone only
  backbone: mock
  dtype: float32          # float64 is used inside invariance tests
  device: cuda_if_available
  downloads_allowed: false
colab:
  purpose: data preparation, LLaDA-8B / Nemotron-3B/8B training and evaluation where memory permits
  dtype: bf16             # requires Ampere+ (A100/L4); T4 lacks bf16 -> not suitable for 8B training
  gradient_checkpointing: false  # custom branch/slot primitives; microbatch accumulation is implemented
  micro_batch_size: 1
  grad_accumulation: 32   # effective batch 32
  persist_to: /content/drive/MyDrive/DiffJev   # checkpoints/manifests survive runtime resets
server_a100x3:
  purpose: 14B training, full scaling sweeps, Exp 5 timing (timing uses ONE A100)
  dtype: bf16
  num_gpus: 3
  micro_batch_size: 1
  grad_accumulation: 32
  timing_device: cuda:0

